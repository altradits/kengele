name: android

on:
  push:
    paths:
      - 'android/**'
      - 'internal/message/testdata/vectors.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'internal/message/testdata/vectors.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    name: build debug APK, run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK and run unit tests
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kengele-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kengele-android-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest
